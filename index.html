<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift Radar</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c11;color:#8a93a6;font:15px -apple-system,Segoe UI,Roboto,sans-serif}
  .c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 24px}
  .s{width:28px;height:28px;border:3px solid #23293a;border-top-color:#3b8beb;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="c"><div class="s"></div><div id="t">Открываем Gift Radar…</div></div>
<script>
// Постоянный адрес приложения. Берём текущий адрес сервера, проверяем, что он отвечает,
// и переходим туда, сохраняя параметры и данные Telegram (они в hash).
// Если сервер как раз меняет адрес — ждём новый, а не показываем ошибку.
var API = 'https://api.github.com/repos/cloudfy01-sys/giftradar-app/contents/url.txt';
var text = document.getElementById('t');

async function currentUrl() {
  try {
    var r = await fetch(API + '?t=' + Date.now(), { headers: { Accept: 'application/vnd.github.raw' }, cache: 'no-store' });
    if (r.ok) return (await r.text()).trim();
  } catch (e) {}
  try {
    return (await (await fetch('url.txt?t=' + Date.now(), { cache: 'no-store' })).text()).trim();
  } catch (e) {}
  return null;
}

async function alive(url) {
  try {
    var c = new AbortController();
    var timer = setTimeout(function () { c.abort(); }, 6000);
    var r = await fetch(url + '/healthz?t=' + Date.now(), { cache: 'no-store', signal: c.signal });
    clearTimeout(timer);
    return r.ok && (await r.text()).trim() === 'ok';
  } catch (e) {
    return false;
  }
}

(async function () {
  for (var i = 0; i < 20; i++) {
    var url = await currentUrl();
    if (url && /^https:\/\//.test(url)) {
      url = url.replace(/\/$/, '');
      if (await alive(url)) {
        location.replace(url + '/' + location.search + location.hash);
        return;
      }
    }
    text.textContent = i < 2 ? 'Подключаемся к серверу…' : 'Сервер обновляет адрес, ещё секунду…';
    await new Promise(function (r) { setTimeout(r, 3000); });
  }
  text.textContent = 'Сервер Gift Radar сейчас недоступен. Попробуй открыть приложение через минуту.';
})();
</script>
</body>
</html>
